name: Test and verify

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[test]"

      - name: Compile and run tests
        run: |
          python -m compileall -q mitotic_density.py cli.py agents tests
          python -m pytest -q

      - name: Validate package entry points
        run: |
          mitotic-density single --mitotic-count 10 --measured-area-mm2 2
          mitotic-agent verify-audit
